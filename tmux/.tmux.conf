set -g default-terminal "tmux-256color"

# 24-bit colour out to the real terminal. tmux only emits it for a client it
# believes can take it, and it decides that three ways: a Tc or RGB capability
# in the outer terminal's terminfo, COLORTERM=truecolor in the attaching
# client's environment, or a match in the hardcoded table of terminals it
# identifies from their XTVERSION reply. Over ssh from Ghostty all three miss.
#
# The table is why this went unnoticed: it carries iTerm2, with RGB, so the old
# terminal was granted truecolour without anything here asking for it. Ghostty
# answers XTVERSION correctly — tmux records the client as `ghostty 1.3.1` — and
# still matches nothing, the table listing only xterm, mintty, iTerm2, foot and
# XTerm as of 3.6. COLORTERM would cover it but does not cross an ssh hop, and
# nothing on either side puts it back.
#
# Terminfo should have been the one that held. Ghostty's own entry does declare
# Tc, and its ssh-terminfo installs that entry — but b090f08 compiles an
# xterm-ghostty alias from the host's ncurses `ghostty` for the connections
# ssh-terminfo never sees, and ncurses' transcription of the terminal omits Tc.
# Whichever arrives first wins, so the capability is there or not depending on
# how the connection was made. Naming the feature here settles it either way.
#
# The cost of missing it is silent rather than broken: every #rrggbb in the
# tmux-powerline theme is rounded to the nearest of the 256 palette entries, and
# since a colorscheme only repaints the first sixteen, those land on stock xterm
# colours a shade off the scheme.
#
# Appending rather than setting: terminal-features is an array whose defaults
# carry the xterm*, screen* and rxvt* entries, and a plain `set` would drop
# them. Hence `-a` and the leading comma, which is the separator.
#
# Features are read once, when a client attaches, so an existing session keeps
# the old set until it is detached and reattached.
set -as terminal-features ",xterm-ghostty:RGB"

set -g focus-events on
set -g mouse on
setw -g mode-keys vi
set -g history-limit 50000
set -g set-clipboard on

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g @plugin 'erikw/tmux-powerline'

run '~/.tmux/plugins/tpm/tpm'
